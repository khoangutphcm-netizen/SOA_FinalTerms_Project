<!doctype html>
<html lang="vi">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PCK — Kho ảnh và video</title>
  <link rel="stylesheet" href="/demo-assets/frame.css" />
  <link rel="stylesheet" href="/demo-assets/screens.css" />
  <div class="shell">
    <header class="topbar">
      <a class="logo" href="#home">PCK<span>.</span></a>
      <nav class="main-nav" aria-label="Điều hướng">
        <a href="#home">Trang chủ</a><a href="#browse">Khám phá</a
        ><a href="#more">Khác</a><a href="#account">Tài khoản</a>
      </nav>
      <form id="global-search" class="topbar-search" role="search" aria-label="Tìm trong kho tác phẩm">
        <input type="search" name="q" aria-label="Tìm ảnh và video" maxlength="100" placeholder="Tìm ảnh, video…" />
        <button type="submit" aria-label="Tìm kiếm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4" stroke-linecap="round"/></svg>
        </button>
      </form>
      <div class="button-row upload-link">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Giao diện tối" aria-pressed="false" title="Đổi giao diện sáng / tối">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 15a8.5 8.5 0 0 1-11.6-11.6A8.5 8.5 0 1 0 20.5 15Z" stroke-linejoin="round"/></svg>
          <svg class="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" stroke-linecap="round"/></svg>
        </button>
        <a id="login-link" class="btn dark" href="#login">Đăng nhập</a
        ><a class="btn light" href="#upload">Đăng tác phẩm ↗</a>
      </div>
    </header>
    <template id="hero-template"
      ><section class="hero catalog-hero">
        <div class="hero-content">
          <h1>
            Kho ảnh<br />
            và video.
          </h1>
          <p>Khám phá góc nhìn mới từ cộng đồng PCK.</p>
          <a class="hero-collection-link" href="#collections"
            >Duyệt bộ sưu tập</a
          >
        </div>
      </section></template
    >
    <main id="app"></main>
    <footer class="footer">
      <a class="logo" href="#home">PCK<span>.</span></a
      ><span>PCK · Bản demo kho nội dung số</span
      ><a id="admin-link" href="#admin" hidden>Quản trị demo ↗</a>
    </footer>
  </div>
  <div id="notice" role="status"></div>
  <script type="module" src="/demo-assets/app.js"></script>
</html>
